# What SpelaionDB's `plugins.toml` says of this plugin besides its builds. The release notes
# are written from here, and `tests/conformance.rs` checks it against what the program says.

# The plugin protocol this plugin speaks.
protocol = "1.3"
# The engines it serves, by the name SpelaionDB's configuration uses (`engine = "mysql"`).
engines = ["mysql", "mariadb"]
# The lowest SpelaionDB it works with.
min_app = "0.12.0"
