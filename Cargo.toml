[package]
name = "spelaiondb-plugin-mysql"
description = "MySQL and MariaDB for SpelaionDB: the engines' driver, served as a plugin"
version = "0.1.6"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/spelaion-dev/spelaiondb-plugin-mysql"
publish = false

# The driver keeps the name it had inside SpelaionDB: its tests and the program use it.
[lib]
name = "spelaion_driver_mysql"

[[bin]]
name = "spelaiondb-plugin-mysql"
path = "src/bin/spelaiondb-plugin-mysql.rs"

# The contract, the engines' dialect and the plugin's side of the protocol come from
# SpelaionDB's repository, by tag (ADR-042): they are one workspace there, so one tag pins
# them together. Moving the tag is how this plugin follows a protocol change.
[dependencies]
spelaion-driver-api = { git = "https://github.com/spelaion-dev/spelaiondb", tag = "plugin-sdk-v0.3.3" }
spelaion-dialect = { git = "https://github.com/spelaion-dev/spelaiondb", tag = "plugin-sdk-v0.3.3" }
spelaion-plugin-sdk = { git = "https://github.com/spelaion-dev/spelaiondb", tag = "plugin-sdk-v0.3.3" }
# The same Arrow as SpelaionDB's: batches cross the two unchanged.
arrow = { version = "60", default-features = false, features = ["ipc"] }
async-trait = "0.1"
futures-util = "0.3"
# minimal-rust: no C code. TLS with rustls and ring: no OpenSSL anywhere. Patched: see
# vendor/mysql_async.
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "rustls-tls", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
insta = "1"
# The conformance set every plugin runs against its own program (tests/conformance.rs).
spelaion-plugin-host = { git = "https://github.com/spelaion-dev/spelaiondb", tag = "plugin-sdk-v0.3.3" }

# mysql_async patched so verify-ca skips the name check (vendor/mysql_async/PATCHED.md): read
# it before upgrading.
[patch.crates-io]
mysql_async = { path = "vendor/mysql_async" }

[lints.rust]
unsafe_code = "forbid"

# What ships is this program: small and without the debugger's tables.
[profile.release]
strip = "symbols"
